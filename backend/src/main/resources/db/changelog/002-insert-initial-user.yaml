databaseChangeLog:
  - property:
      name: initial_admin_username
      value: "admin"
  - property:
      name: initial_admin_name
      value: "Admin User"
  - property:
      name: initial_admin_password_hash
      value: "$2a$10$Sy0HLv6EANMf5L7JoGfsbuPGRihWh8HWf3/ja6KfGAUtwBOqMQRPW"

  - changeSet:
      id: 002-insert-initial-user
      author: mensal-3
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 1
                sql: "SELECT COUNT(*) FROM usuario WHERE login = '${initial_admin_username}'"
      changes:
        - insert:
            tableName: usuario
            columns:
              - column:
                  name: nome
                  value: "${initial_admin_name}"
              - column:
                  name: login
                  value: "${initial_admin_username}"
              - column:
                  name: senha
                  value: "${initial_admin_password_hash}"
              - column:
                  name: role
                  value: "GESTOR"
              - column:
                  name: ativo
                  valueBoolean: true
      rollback:
        - delete:
            tableName: usuario
            where: "login = '${initial_admin_username}' AND nome = '${initial_admin_name}'"
